<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Minhas Finanças</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316a34a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ER$%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --card2:#f7f9f6; --text:#14201a; --muted:#66756c; --line:#e3e8e3;
  --accent:#16a34a; --accent-soft:#dcfce7; --red:#dc2626; --red-soft:#fee2e2; --blue:#2563eb; --blue-soft:#dbeafe;
  --amber:#b45309; --amber-soft:#fef3c7; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --hero:#0f2a1c; --hero-text:#eafff1;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b100d; --card:#141b17; --card2:#18211c; --text:#e8efe9; --muted:#8fa096; --line:#24302a;
    --accent:#22c55e; --accent-soft:#12301f; --red:#f87171; --red-soft:#3a1717; --blue:#60a5fa; --blue-soft:#14233d;
    --amber:#fbbf24; --amber-soft:#3a2c0b; --shadow:none; --hero:#123322; --hero-text:#eafff1;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.35;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 24px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 14px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.mnav{display:flex;align-items:center;gap:4px}
.mnav .lbl{font-weight:650;min-width:130px;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}

/* hero */
.hero{background:var(--hero);color:var(--hero-text);border-radius:20px;padding:18px 18px 16px;margin-bottom:12px}
.hero .k{font-size:13px;opacity:.75}
.hero .big{font-size:32px;font-weight:750;letter-spacing:-.02em;margin:2px 0 12px}
.hero .big.neg{color:#fca5a5}
.hero .row{display:flex;gap:10px}
.hero .row>div{flex:1;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px}
.hero .row .k{font-size:12px}
.hero .row .v{font-weight:650;font-size:15px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:12px;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;opacity:.85}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}

/* stat grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);text-align:left;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-weight:700;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.sec-h h2{font-size:14px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.sec-h .tot{font-weight:700;font-size:14px}
.sec-sub{padding:0 14px 8px;font-size:12px;color:var(--muted)}
.grp-h{width:100%;text-align:left}
.grp .sec-sub{padding-bottom:12px}
.grp .progress{margin-top:-4px;margin-bottom:12px}
.grp .tot{display:flex;align-items:center;gap:6px}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none}
.grp.open .grp-body{display:block}
.dot{width:9px;height:9px;border-radius:3px;background:var(--c)}
.item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.item:active{background:var(--card2)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);margin-top:1px;display:flex;gap:6px;flex-wrap:wrap}
.item .val{font-weight:650;white-space:nowrap}
.item.done .t{color:var(--muted);text-decoration:line-through}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.card{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.parc{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.check svg{width:15px;height:15px}
.add-row{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;width:100%}
.empty{padding:6px 14px 14px;color:var(--muted);font-size:13px}
.progress{height:4px;background:var(--line);border-radius:4px;margin:0 14px 10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}

.pay{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.pay .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);flex:none}
.pay .ic svg{width:16px;height:16px}
.pay .ic.card{background:var(--blue-soft);color:var(--blue)}
.pay .main{flex:1;min-width:0}
.pay .meter{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.pay .meter i{display:block;height:100%;background:var(--blue)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:13px;font-weight:650;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn-row{display:flex;gap:8px;padding:12px 14px 14px}
.empty-month{text-align:center;padding:28px 18px}
.empty-month p{color:var(--muted);margin:6px 0 16px}

/* history */
.hrow{padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left;display:block}
.hrow .h1{display:flex;justify-content:space-between;font-weight:650}
.hbars{display:flex;flex-direction:column;gap:3px;margin-top:7px}
.hbars div{height:6px;border-radius:4px}
.hrow .h2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* bottom nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);border-radius:10px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);font-weight:650}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(22,163,74,.35);z-index:21}
.fab svg{width:26px;height:26px}
.fab-mic{position:fixed;right:calc(max(16px,calc(50% - 264px)) + 4px);bottom:calc(144px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:16px;background:var(--card);color:var(--accent);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.12);z-index:21}
.fab-mic svg{width:22px;height:22px}
.mic-big{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin:4px auto 8px}
.mic-big svg{width:36px;height:36px}
.mic-big.on{animation:pulso 1.2s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}100%{box-shadow:0 0 0 24px rgba(22,163,74,0)}}
.voz-status{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px;min-height:18px}
.sheet textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:12px;font:inherit;font-size:16px;outline:none;resize:none}
.sheet textarea:focus{border-color:var(--accent)}
.prev{border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-bottom:12px;overflow:hidden}
.prev>div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.prev>div:first-child{border-top:0}
.prev span{color:var(--muted)}
.prev b{text-align:right}
.voz-ex{margin-top:14px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.voz-ex>div{width:100%}
.voz-ex .chip{font-size:12px;padding:4px 9px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.show{opacity:1}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(30px);transition:transform .2s}
.ov.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-size:18px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.f input,.f select{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:0 12px;font:inherit;font-size:16px;outline:none}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f .hint{font-size:12px;color:var(--muted);margin-top:4px}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:38px;font-weight:650;font-size:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);border:1px solid var(--line)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
.note{font-size:12.5px;color:var(--muted);padding:0 4px 12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-left:6px;vertical-align:middle}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.sync.ok{--c:var(--accent)} .sync.busy{--c:var(--amber)} .sync.err{--c:var(--red);color:var(--red)}
.steps{margin:0;padding:0 14px 12px 32px;font-size:13px;color:var(--muted)}
.steps li{margin-bottom:4px}
.steps b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<button class="fab-mic" id="fabMic" aria-label="Lançar por voz" data-a="voz">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
</button>
<button class="fab" id="fab" aria-label="Novo lançamento" data-a="add">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav"><div class="in" id="nav">
  <button data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Mês</button>
  <button data-tab="fixos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Fixos</button>
  <button data-tab="invest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Investido</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Histórico</button>
  <button data-tab="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ============ utilidades ============ */
const KEY = 'financas_thiago_v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = v => BRL.format(v || 0);
const fmtIn = v => (v || v === 0) ? Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round = n => Math.round(n * 100) / 100;
const sum = (arr, f = x => x.valor) => round(arr.reduce((a, x) => a + (Number(f(x)) || 0), 0));
function parseMoney(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').trim().replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');   // "1.200" = mil e duzentos
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : round(n);
}
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function addMonth(key, d) {
  let [y, m] = key.split('-').map(Number); m += d;
  while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
  return `${y}-${String(m).padStart(2, '0')}`;
}
function diffMonths(a, b) { const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number); return (yb - ya) * 12 + (mb - ma); }
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function label(key) { const [y, m] = key.split('-').map(Number); return `${MESES[m - 1]} ${y}`; }
function shortLabel(key) { const [y, m] = key.split('-').map(Number); return `${MES_CURTO[m - 1]}/${String(y).slice(2)}`; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800); }

const ICON = {
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>',
  pix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z"/><path d="M8 12h8"/></svg>',
  boleto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M17 5v14M20 5v14"/></svg>',
  debito: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18"/></svg>',
  dinheiro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  outro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
};

/* ============ persistência local ============ */
let S;
function normalize() {
  S.pagamentos ||= []; S.fixos ||= []; S.meses ||= {}; S.updatedAt ||= 0;
  Object.values(S.meses).forEach(m => { m.extras ||= []; m.fixas ||= []; m.variaveis ||= []; m.invest ||= []; m.retiradas ||= []; });
  // versões antigas guardavam parcelados à parte; agora cada parcela fica gravada no seu mês
  if (S.parcelados && S.parcelados.length) {
    S.parcelados.forEach(p => {
      for (let i = 0; i < p.n; i++) {
        const k = addMonth(p.inicio, i); garantirMes(k);
        S.meses[k].variaveis.push({ id: uid(), desc: p.desc, valor: p.valor, pag: p.pag || '', parc: { g: p.id, i: i + 1, n: p.n } });
      }
    });
  }
  delete S.parcelados;
}
/* cria o mês (com salário padrão e fixos) se ainda não existir */
function garantirMes(k) { if (!S.meses[k]) S.meses[k] = novoMes(k); return S.meses[k]; }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); } } catch (e) { S = null; }
  if (!S || !S.meses) { S = seed(); S.updatedAt = 0; saveLocal(); }
  normalize();
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Não foi possível salvar neste aparelho'); }
}
/* toda alteração feita pelo usuário passa por aqui */
function save() {
  S.updatedAt = Date.now();
  saveLocal();
  SY.dirty = true; saveSync();
  agendarSync();
}

/* ============ sincronização com GitHub ============ */
/* config fica só neste aparelho; o token nunca vai para o arquivo de dados */
const SYNC_KEY = 'financas_sync_v1';
const SY = { owner: '', repo: '', path: 'dados.json', token: '', auto: true, sha: null, dirty: false, lastSync: 0 };
const syncState = { status: 'off', msg: '' };
function loadSync() { try { Object.assign(SY, JSON.parse(localStorage.getItem(SYNC_KEY) || '{}')); } catch (e) {} }
function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) {} }
const syncOn = () => !!(SY.owner && SY.repo && SY.token);
const b64enc = s => { const by = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
const enc = s => encodeURIComponent(s.trim());
const repoUrl = () => `https://api.github.com/repos/${enc(SY.owner)}/${enc(SY.repo)}`;
const fileUrl = () => `${repoUrl()}/contents/${(SY.path || 'dados.json').split('/').map(enc).join('/')}`;
function gh(url, method = 'GET', body) {
  return fetch(url, {
    method, cache: 'no-store',
    headers: { Authorization: `Bearer ${SY.token.trim()}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
}
async function ghErro(r) {
  let m = ''; try { m = (await r.json()).message || ''; } catch (e) {}
  if (r.status === 401) return 'Token inválido ou expirado';
  if (r.status === 403) return 'Token sem permissão de escrita (Contents: Read and write)';
  if (r.status === 404) return 'Repositório não encontrado ou token sem acesso a ele';
  return `Erro ${r.status}${m ? ': ' + m : ''}`;
}
function setSync(status, msg = '') {
  syncState.status = status; syncState.msg = msg;
  document.querySelectorAll('[data-sync]').forEach(el => { el.className = 'sync ' + status; el.textContent = syncLabel(); });
}
function syncLabel() {
  if (!syncOn()) return 'Só neste aparelho';
  return { ok: 'Salvo no GitHub', busy: 'Sincronizando…', err: 'Erro ao sincronizar', pend: 'Alterações pendentes', off: 'GitHub' }[syncState.status] || 'GitHub';
}
async function puxar() {
  const r = await gh(fileUrl());
  if (r.status === 404) {
    const rr = await gh(repoUrl()); // diferencia "arquivo não existe" de "repo inacessível"
    if (!rr.ok) throw new Error(await ghErro(rr));
    return null;
  }
  if (!r.ok) throw new Error(await ghErro(r));
  const j = await r.json();
  return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
}
async function enviar() {
  const body = { message: `Atualização ${new Date().toLocaleString('pt-BR')}`, content: b64enc(JSON.stringify(S, null, 1)) };
  if (SY.sha) body.sha = SY.sha;
  const r = await gh(fileUrl(), 'PUT', body);
  if (r.status === 409 || r.status === 422) return 'conflito';
  if (!r.ok) throw new Error(await ghErro(r));
  const j = await r.json();
  SY.sha = j.content.sha; SY.dirty = false; SY.lastSync = Date.now(); saveSync();
  return 'ok';
}
function adotarRemoto(rem) {
  S = rem.data; normalize(); saveLocal();
  SY.sha = rem.sha; SY.dirty = false; SY.lastSync = Date.now(); saveSync();
  if (!S.meses[ui.mes]) ui.mes = mesInicial();
  render();
}
let syncing = false, syncAgain = false, syncTimer = null;
function agendarSync() {
  if (!syncOn() || !SY.auto) { if (syncOn()) setSync('pend'); return; }
  setSync('pend'); clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, 1500);
}
async function sincronizar(opts = {}) {
  if (!syncOn()) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync('busy');
  try {
    for (let tentativa = 0; tentativa < 3; tentativa++) {
      const rem = await puxar();
      if (!rem) { if ((await enviar()) === 'ok') break; else continue; }   // arquivo ainda não existe: cria
      if (rem.sha === SY.sha) {                                            // ninguém mexeu no GitHub desde a última vez
        if (SY.dirty && (await enviar()) === 'conflito') continue;
        break;
      }
      // o arquivo no GitHub mudou (outro aparelho)
      if (!SY.dirty) { adotarRemoto(rem); if (!opts.silent) toast('Dados atualizados do GitHub'); break; }
      const usarRemoto = confirm('Os dados no GitHub foram alterados em outro aparelho e este aparelho também tem alterações não enviadas.\n\nOK = ficar com os dados do GitHub\nCancelar = ficar com os dados deste aparelho (substitui o GitHub)');
      if (usarRemoto) { adotarRemoto(rem); break; }
      SY.sha = rem.sha;   // sobrescreve o remoto com o local
      if ((await enviar()) === 'ok') break;
    }
    setSync(SY.dirty ? 'pend' : 'ok');
    if (opts.toastOk) toast('Sincronizado com o GitHub');
  } catch (e) {
    setSync('err', e.message || 'Sem conexão');
    if (!opts.silent || opts.toastOk) toast(e.message || 'Sem conexão com o GitHub');
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; sincronizar({ silent: true }); }
  }
}
async function conectarGitHub() {
  setSync('busy');
  try {
    const r = await gh(repoUrl());
    if (!r.ok) throw new Error(await ghErro(r));
    const repo = await r.json();
    if (!repo.private && !confirm(`ATENÇÃO: o repositório "${repo.full_name}" é PÚBLICO. Qualquer pessoa poderá ver suas finanças.\n\nO recomendado é usar um repositório privado. Continuar mesmo assim?`)) {
      SY.token = ''; saveSync(); setSync('off'); render(); return;
    }
    SY.sha = null; saveSync();
    await sincronizar({ toastOk: true });
    render();
  } catch (e) { setSync('err', e.message); toast(e.message); render(); }
}

/* ============ regras ============ */
const pagById = id => S.pagamentos.find(p => p.id === id);
const pagNome = id => pagById(id)?.nome || 'Não informado';
const isCard = id => pagById(id)?.tipo === 'cartao';
function pagChip(id) {
  if (!id) return '';
  return `<span class="chip ${isCard(id) ? 'card' : ''}">${esc(pagNome(id))}</span>`;
}
function novoMes(key) {
  return {
    salario: S.salarioPadrao,
    extras: [],
    fixas: S.fixos.map(f => ({ id: uid(), ref: f.id, nome: f.nome, valor: f.valor, pag: f.pag, pago: false })),
    variaveis: [], invest: [], retiradas: [],
  };
}
function totais(m) {
  const salario = Number(m.salario) || 0;
  const extra = sum(m.extras);
  const resgate = sum((m.retiradas || []).filter(r => r.entra));   // retirada que volta para o caixa do mês
  const fixas = sum(m.fixas);
  const variaveis = sum(m.variaveis);
  const invest = sum(m.invest);
  const entradas = round(salario + extra + resgate);
  const gastos = round(fixas + variaveis);
  const saidas = round(gastos + invest);
  return { salario, extra, resgate, fixas, variaveis, invest, entradas, gastos, saidas, sobra: round(entradas - saidas) };
}
function porPagamento(m) {
  const map = {};
  const add = (pag, v) => { const k = pag || ''; map[k] = round((map[k] || 0) + (Number(v) || 0)); };
  m.fixas.forEach(f => add(f.pag, f.valor));
  m.variaveis.forEach(v => add(v.pag, v.valor));
  return Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
}
const parcChip = it => it.parc ? `<span class="chip parc">Parcela ${it.parc.i}/${it.parc.n}</span>` : '';
/* todas as parcelas de um mesmo lançamento, em todos os meses */
function parcelasDoGrupo(g) {
  const out = [];
  Object.keys(S.meses).sort().forEach(k => ['variaveis', 'invest', 'extras'].forEach(l =>
    S.meses[k][l].forEach(it => { if (it.parc && it.parc.g === g) out.push({ k, l, it }); })));
  return out;
}

/* ============ investimentos ============ */
const chaveDestino = s => norm(s).replace(/\s+/g, ' ').trim();
function carteira() {
  const hoje = todayKey(), dest = {}, movs = [];
  let aportes = 0, retiradas = 0, ateHoje = 0, futuro = 0;
  const pegar = nome => { const c = chaveDestino(nome) || 'sem nome'; return dest[c] ||= { nome: nome || 'Sem nome', aportes: 0, retiradas: 0 }; };
  Object.keys(S.meses).sort().forEach(k => {
    const m = S.meses[k];
    m.invest.forEach(it => {
      const d = pegar(it.desc); d.aportes = round(d.aportes + it.valor); aportes = round(aportes + it.valor);
      if (k <= hoje) ateHoje = round(ateHoje + it.valor); else futuro = round(futuro + it.valor);
      movs.push({ k, tipo: 'aporte', it });
    });
    (m.retiradas || []).forEach(it => {
      const d = pegar(it.destino); d.retiradas = round(d.retiradas + it.valor); retiradas = round(retiradas + it.valor);
      if (k <= hoje) ateHoje = round(ateHoje - it.valor); else futuro = round(futuro - it.valor);
      movs.push({ k, tipo: 'retirada', it });
    });
  });
  const destinos = Object.values(dest).map(d => ({ ...d, saldo: round(d.aportes - d.retiradas) })).sort((a, b) => b.saldo - a.saldo);
  return { aportes, retiradas, saldo: round(aportes - retiradas), ateHoje, futuro, destinos, movs: movs.reverse() };
}
/* aplica mudança de um fixo aos meses já criados a partir do mês atual (só itens ainda não pagos) */
function mesesFuturos() { const t = todayKey(); return Object.keys(S.meses).filter(k => k >= t); }

function mesInicial() {
  const t = todayKey(), ks = Object.keys(S.meses).sort();
  if (S.meses[t] || !ks.length) return t;
  return ks.find(k => k >= t) || ks[ks.length - 1];
}

/* ============ formulário (bottom sheet) ============ */
function pagOptions(sel) {
  return [{ v: '', l: 'Não informado' }, ...S.pagamentos.map(p => ({ v: p.id, l: p.nome }))]
    .map(o => `<option value="${esc(o.v)}" ${o.v === (sel || '') ? 'selected' : ''}>${esc(o.l)}</option>`).join('');
}
function fieldHtml(f) {
  const show = f.show ? ` data-show="${f.show}"` : '';
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  if (f.type === 'money') return `<div class="f"${show}><label>${f.label}</label><div class="money"><span>R$</span><input name="${f.name}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${fmtIn(f.value)}"></div>${hint}</div>`;
  if (f.type === 'pag') return `<div class="f"${show}><label>${f.label || 'Forma de pagamento'}</label><select name="${f.name}">${pagOptions(f.value)}</select>${hint}</div>`;
  if (f.type === 'select') return `<div class="f"${show}><label>${f.label}</label><select name="${f.name}">${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === f.value ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>${hint}</div>`;
  if (f.type === 'seg') return `<div class="f"${show}>${f.label ? `<label>${f.label}</label>` : ''}<div class="seg" data-seg="${f.name}">${f.options.map(o => `<button type="button" data-v="${o.v}" class="${o.v === f.value ? 'on' : ''}">${o.l}</button>`).join('')}</div><input type="hidden" name="${f.name}" value="${esc(f.value)}">${hint}</div>`;
  if (f.type === 'check') return `<div class="f"${show}><label class="sw" style="margin:0;color:var(--text);font-size:15px;font-weight:500">${f.label}<input type="checkbox" name="${f.name}" ${f.value ? 'checked' : ''}></label>${hint}</div>`;
  if (f.type === 'month') return `<div class="f"${show}><label>${f.label}</label><input type="month" name="${f.name}" value="${esc(f.value)}">${hint}</div>`;
  if (f.type === 'password') return `<div class="f"${show}><label>${f.label}</label><input name="${f.name}" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(f.value)}" placeholder="${esc(f.ph || '')}">${hint}</div>`;
  if (f.type === 'number') return `<div class="f"${show}><label>${f.label}</label><input name="${f.name}" type="number" inputmode="numeric" min="${f.min ?? 1}" max="${f.max ?? 120}" value="${esc(f.value)}">${hint}</div>`;
  return `<div class="f"${show}><label>${f.label}</label><input name="${f.name}" autocomplete="off" value="${esc(f.value)}" placeholder="${esc(f.ph || '')}">${hint}</div>`;
}
function openSheet({ title, fields, onSave, onDelete, deleteLabel, saveLabel, extras = [] }) {
  const ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = `<form class="sheet" novalidate><div class="grab"></div><h3>${title}</h3>
    ${fields.map(fieldHtml).join('')}
    <div class="sheet-actions">
      <button class="btn" type="submit">${saveLabel || 'Salvar'}</button>
      ${onDelete ? `<button class="btn danger" type="button" data-del>${deleteLabel || 'Excluir'}</button>` : ''}
      ${extras.map((x, i) => `<button class="btn ${x.cls || 'ghost'}" type="button" data-extra="${i}">${x.label}</button>`).join('')}
      <button class="btn ghost" type="button" data-close>Cancelar</button>
    </div></form>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => ov.classList.add('show'));
  const form = ov.querySelector('form');
  const close = () => { ov.classList.remove('show'); document.body.style.overflow = ''; setTimeout(() => ov.remove(), 200); };
  const applyShow = () => {
    const segs = {}; form.querySelectorAll('input[type=hidden]').forEach(i => segs[i.name] = i.value);
    form.querySelectorAll('[data-show]').forEach(el => {
      const [k, vals] = el.dataset.show.split('='); el.style.display = vals.split(',').includes(segs[k]) ? '' : 'none';
    });
  };
  form.querySelectorAll('[data-seg]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    form.querySelector(`input[name="${seg.dataset.seg}"]`).value = b.dataset.v; applyShow();
  }));
  applyShow();
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
  ov.querySelector('[data-del]')?.addEventListener('click', () => { if (onDelete() !== false) { save(); close(); render(); } });
  ov.querySelectorAll('[data-extra]').forEach(b => b.addEventListener('click', () => { if (extras[+b.dataset.extra].fn() !== false) { save(); close(); render(); } }));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const vals = {};
    fields.forEach(f => {
      const el = form.elements[f.name]; if (!el) return;
      if (f.type === 'money') vals[f.name] = parseMoney(el.value);
      else if (f.type === 'check') vals[f.name] = el.checked;
      else if (f.type === 'number') vals[f.name] = parseInt(el.value, 10) || 0;
      else vals[f.name] = el.value.trim();
    });
    const res = onSave(vals);
    if (res === false) return;
    if (res !== 'nosave') save();
    close(); render();
  });
  const first = form.querySelector('input:not([type=hidden]):not([type=checkbox]),select');
  if (first && !('ontouchstart' in window)) first.focus();
}

/* ============ ações ============ */
function need(v, msg) { if (!v) { toast(msg); return false; } return true; }

      { type: 'seg', name: 'tipo', value: tipo, options: [{ v: 'gasto', l: 'Gasto' }, { v: 'fixo', l: 'Fixo' }, { v: 'invest', l: 'Investir' }, { v: 'renda', l: 'Renda' }] },
      { type: 'text', name: 'desc', label: 'Descrição', value: pre.desc || '', ph: 'Ex.: Mercado, Academia, Freela…' },
      { type: 'money', name: 'valor', label: 'Valor', value: pre.valor || '', hint: '' },
      { type: 'pag', name: 'pag', value: pre.pag || '', show: 'tipo=gasto,fixo' },
      { type: 'number', name: 'parcelas', label: 'Parcelas', value: pre.parcelas || 1, min: 1, show: 'tipo=gasto,invest,renda', hint: 'Com 2 ou mais, as próximas parcelas são lançadas nos meses seguintes (criando os meses que faltarem).' },
      { type: 'seg', name: 'modo', label: 'O valor informado é', value: 'parcela', show: 'tipo=gasto,invest,renda', options: [{ v: 'parcela', l: 'De cada parcela' }, { v: 'total', l: 'Total' }] },
      { type: 'check', name: 'recorrente', label: 'Repetir todo mês (cadastrar como fixo)', value: true, show: 'tipo=fixo', hint: 'Desmarcado: entra só em ' + label(k) + '.' },
    ],
    onSave: v => {
      if (!need(v.desc, 'Informe a descrição') || !need(v.valor > 0 || v.tipo === 'fixo', 'Informe o valor')) return false;
      lancar(v);
    },
  });
}

/* grava um lançamento a partir do mês aberto (usado pelo formulário e pela voz) */
function lancar(v, k = ui.mes) {
  const m = garantirMes(k);
  if (v.tipo === 'fixo') {
    if (v.recorrente) {
      const f = { id: uid(), nome: v.desc, valor: v.valor, pag: v.pag };
      S.fixos.push(f);
      const alvos = new Set([...mesesFuturos(), k]);
      alvos.forEach(mk => S.meses[mk].fixas.push({ id: uid(), ref: f.id, nome: f.nome, valor: f.valor, pag: f.pag, pago: false }));
    } else m.fixas.push({ id: uid(), ref: null, nome: v.desc, valor: v.valor, pag: v.pag, pago: false });
    toast('Lançado em ' + label(k));
    return;
  }
  const lista = { gasto: 'variaveis', invest: 'invest', renda: 'extras' }[v.tipo];
  const n = Math.max(1, Math.min(120, parseInt(v.parcelas, 10) || 1));
  // valor de cada parcela; se veio o total, o centavo que sobrar vai na 1ª parcela
  const cada = v.modo === 'total' ? Math.floor(v.valor / n * 100) / 100 : v.valor;
  const primeira = v.modo === 'total' ? round(v.valor - cada * (n - 1)) : v.valor;
  const g = n > 1 ? uid() : null;
  const criados = [];
  for (let i = 0; i < n; i++) {
    const mk = addMonth(k, i);
    if (!S.meses[mk]) criados.push(mk);
    const it = { id: uid(), desc: v.desc, valor: i === 0 ? primeira : cada };
    if (lista === 'variaveis') it.pag = v.pag || '';
    if (g) it.parc = { g, i: i + 1, n };
    garantirMes(mk)[lista].push(it);
  }
  toast(n > 1 ? `${n} parcelas lançadas: ${shortLabel(k)} a ${shortLabel(addMonth(k, n - 1))}${criados.length ? ` (${criados.length} ${criados.length === 1 ? 'mês criado' : 'meses criados'})` : ''}` : 'Lançado em ' + label(k));
}

/* ============ lançamento por voz ============ */
const NUMW = { zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, quatorze: 14, catorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19, vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90, cem: 100, cento: 100, duzentos: 200, duzentas: 200, trezentos: 300, trezentas: 300, quatrocentos: 400, quinhentos: 500, seiscentos: 600, setecentos: 700, oitocentos: 800, novecentos: 900 };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* "mil e duzentos e cinquenta" -> "1250" */
function palavrasParaNumeros(s) {
  const tk = s.split(' '), out = [];
  const isN = w => w in NUMW || w === 'mil';
  for (let i = 0; i < tk.length; i++) {
    const w = tk[i];
    if (!isN(w) || ((w === 'um' || w === 'uma') && tk[i + 1] !== 'mil')) { out.push(w); continue; }
    let total = 0, cur = 0, j = i;
    while (j < tk.length) {
      const x = tk[j];
      if (x in NUMW && !((x === 'um' || x === 'uma') && j > i && tk[j - 1] !== 'e')) { cur += NUMW[x]; j++; }
      else if (x === 'mil') { total += (cur || 1) * 1000; cur = 0; j++; }
      else if (x === 'e' && j > i && tk[j + 1] in NUMW) j++;
      else break;
    }
    out.push(String(total + cur)); i = j - 1;
  }
  return out.join(' ');
}
function aliasesPag(p) {
  const n = norm(p.nome).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const al = new Set([n]);
  const sem = n.replace(/^cartao( de credito)? /, '');
  al.add(sem);
  if (/\bnu\b/.test(n)) { al.add(n.replace(/\bnu\b/, 'nubank')); al.add(sem.replace(/\bnu\b/, 'nubank')); }
  ({ pix: ['pix'], boleto: ['boleto'], debito: ['debito', 'debito em conta'], dinheiro: ['dinheiro', 'especie'] }[p.tipo] || []).forEach(x => al.add(x));
  return [...al].filter(Boolean);
}
const STRONG = new Set('gastei gasto gastar gasta paguei pago pagar paga pagamento comprei compra comprar compro foi reais real r$ centavos centavo x vezes vez parcelas parcela parcelado parcelada parcelei cartao credito debito investi investir investimento investimentos aplicacao aplicacoes apliquei guardei guardar poupanca recebi ganhei receber recebido renda extra entrou fixo fixa todo toda mes mensal mensalmente hoje ontem coloca coloque colocar lanca lance lancar lancamento adiciona adicione adicionar anota anote anotar conto contos pila pilas valor deu ficou custou que eu ai tipo salario quitei esse essa este esta nesse nessa neste nesta agora retirei resgatei resgate resgatar retirada retirar saquei sacar tirei'.split(' '));
const WEAK = new Set('de do da dos das no na nos nas com o a os as e em para pra meu minha meus minhas um uma pelo pela por num numa via'.split(' '));

function interpretar(txt) {
  const m = S.meses[ui.mes];
  let t = norm(txt).replace(/[!?;:"]/g, ' ').replace(/r\$\s*/g, 'r$').replace(/\s+/g, ' ').trim();
  t = palavrasParaNumeros(t);
  t = t.replace(/r\$([\d.,]+)/g, '$1 reais');
  t = t.replace(/(\d+)\s*(?:reais|real)?\s*e\s*(\d{1,2})\s*centavos?/g, (_, a, b) => `${a},${b.padStart(2, '0')} reais`);
  t = ' ' + t + ' ';
  const r = { acao: 'lancar', tipo: 'gasto', desc: '', valor: 0, total: 0, pag: '', parcelas: 1, recorrente: true };

  // parcelas: "em 10 vezes", "10x de 120", "parcelado em 3"
  let semParc = t;
  const pm = t.match(/(?:parcelad[oa] em |em )?(\d{1,2})\s*(?:x|vezes|parcelas?)(?=\s)(?:\s+de\s+([\d.,]+))?/) || t.match(/parcelad[oa] em (\d{1,2})(?=\s)/);
  if (pm && +pm[1] > 1) { r.parcelas = Math.min(120, +pm[1]); semParc = t.replace(pm[0], ' '); }

  // valor: prefere número com "reais"; senão o maior
  let melhor = null;
  for (const mm of semParc.matchAll(/(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(\s*(?:reais|real|conto|contos|pila|pilas)\b)?/g)) {
    const c = { v: parseMoney(mm[1]), s: mm[2] ? 1 : 0 };
    if (!melhor || c.s > melhor.s || (c.s === melhor.s && c.v > melhor.v)) melhor = c;
  }
  const valorDito = melhor ? melhor.v : 0;
  if (r.parcelas > 1) {
    if (pm && pm[2]) { r.valor = parseMoney(pm[2]); r.total = round(r.valor * r.parcelas); }
    else { r.total = valorDito; r.valor = round(valorDito / r.parcelas); }
  } else r.valor = valorDito;

  // forma de pagamento: o nome mais específico que aparecer na frase
  let pagAlias = '';
  S.pagamentos.forEach(p => aliasesPag(p).forEach(a => {
    if (new RegExp(`\\s${escRe(a)}\\s`).test(t) && a.length > pagAlias.length) { pagAlias = a; r.pag = p.id; }
  }));
  if (!r.pag && /\s(cartao|credito)\s/.test(t)) { const cs = S.pagamentos.filter(p => p.tipo === 'cartao'); if (cs.length === 1) r.pag = cs[0].id; }
  const pagWords = new Set(pagAlias.split(' ').filter(Boolean));

  // tipo
  if (/\s(retirei|resgatei|resgate|resgatar|retirada|retirar|saquei|sacar|tirei)\s/.test(t)) {
    r.acao = 'retirada';
    let achou = '';
    carteira().destinos.forEach(d => { const n = chaveDestino(d.nome); if (n && new RegExp(`\\s${escRe(n)}\\s`).test(t) && n.length > chaveDestino(achou).length) achou = d.nome; });
    r.destino = achou || (carteira().destinos[0] || {}).nome || '';
    chaveDestino(r.destino).split(' ').forEach(w => pagWords.add(w));   // não repete o destino na descrição
  }
  else if (/\s(salario)\s/.test(t) && !/\sextra\s/.test(t)) r.acao = 'salario';
  else if (/\s(invest\w*|apliquei|aplicacao|guardei|guardar|poupanca|reserva)\s/.test(t)) r.tipo = 'invest';
  else if (/\s(recebi|ganhei|renda|entrou|freela|bonus|recebido)\s/.test(t)) r.tipo = 'renda';
  else if (/\s(fixo|fixa|todo mes|toda mes|mensal|mensalmente)\s/.test(t)) r.tipo = 'fixo';

  // "paguei o aluguel" -> marca a fixa como paga
  if (r.acao === 'lancar' && r.tipo === 'gasto' && /\s(paguei|pago|quitei)\s/.test(t) && r.parcelas === 1) {
    let achou = null;
    m.fixas.forEach(f => { const n = norm(f.nome).trim(); if (n && new RegExp(`\\s${escRe(n)}\\s`).test(t) && (!achou || n.length > norm(achou.nome).length)) achou = f; });
    if (achou) { r.acao = 'pagar-fixa'; r.fixa = achou; }
  }

  // descrição: o que sobrar da frase original, mantendo acentos
  const tk = String(txt).split(/\s+/).map(w => {
    const n = norm(w).replace(/[^a-z0-9$]/g, '');
    let cls = 'K';
    if (!n || /\d/.test(n) || STRONG.has(n) || n === 'mil' || (n in NUMW && n !== 'um' && n !== 'uma') || pagWords.has(n) || n === 'nubank') cls = 'S';
    else if (WEAK.has(n)) cls = 'W';
    return { w: w.replace(/^[.,!?;:"]+|[.,!?;:"]+$/g, ''), cls };
  });
  const out = [];
  tk.forEach((x, i) => {
    if (x.cls === 'K') { out.push(x.w); return; }
    if (x.cls !== 'W' || !out.length) return;
    let j = i + 1; while (j < tk.length && tk[j].cls === 'W') j++;
    if (j < tk.length && tk[j].cls === 'K' && tk.slice(i, j).every(y => y.cls === 'W')) {
      // só mantém conectores entre palavras que ficam ("reserva de emergência")
      if (tk[i - 1] && (tk[i - 1].cls === 'K' || (tk[i - 1].cls === 'W' && out.length))) out.push(x.w);
    }
  });
  let d = out.join(' ').trim();
  d = d ? d.charAt(0).toUpperCase() + d.slice(1) : ({ gasto: 'Gasto', fixo: 'Gasto fixo', invest: 'Investimento', renda: 'Renda extra' }[r.tipo]);
  r.desc = d;
  return r;
}

    try { rec.start(); } catch (e) { st.textContent = 'Toque no campo abaixo e use o microfone do teclado.'; }
  }
  const fechar = () => { parar(); ov.classList.remove('show'); document.body.style.overflow = ''; setTimeout(() => ov.remove(), 200); };

  mic.addEventListener('click', ouvir);
  ta.addEventListener('input', atualizar);
  ov.addEventListener('click', e => {
    if (e.target === ov || e.target.closest('[data-close]')) return fechar();
    const ex = e.target.closest('[data-ex]'); if (ex) { parar(); ta.value = ex.dataset.ex; atualizar(); }
  });
  ok.addEventListener('click', () => {
    if (!r || ok.disabled) return;
    if (r.acao === 'pagar-fixa') { r.fixa.pago = true; if (r.valor) r.fixa.valor = r.valor; toast(r.fixa.nome + ' marcada como paga'); }
    else if (r.acao === 'salario') { m.salario = r.valor; toast('Salário atualizado'); }
    else if (r.acao === 'retirada') {
      const desc = r.desc && !/^(Gasto|Investimento|Renda extra)$/.test(r.desc) ? r.desc : '';
      m.retiradas.push({ id: uid(), destino: r.destino, valor: r.valor, desc, entra: true });
      toast(`Retirada de ${fmt(r.valor)} registrada`);
    }
    else lancar(r);
    save(); fechar(); render();
  });
  edit.addEventListener('click', () => {
    if (!r) return; fechar();
    setTimeout(() => {
      if (r.acao === 'pagar-fixa') editFixaMes(r.fixa.id);
      else if (r.acao === 'salario') editSalario(r.valor);
      else if (r.acao === 'retirada') retirada(r.destino, null, { valor: r.valor });
      else addLancamento(r.tipo, r);
    }, 220);
  });
  atualizar();
  ouvir();
}

function editSalario(valor) {
  const m = S.meses[ui.mes];
  openSheet({ title: 'Salário de ' + label(ui.mes), fields: [{ type: 'money', name: 'salario', label: 'Valor', value: valor || m.salario, hint: 'Para mudar o padrão dos próximos meses, use Ajustes.' }], onSave: v => { m.salario = v.salario; } });
}

function editSimple(listName, id, title, withPag) {
  const m = S.meses[ui.mes], it = m[listName].find(x => x.id === id); if (!it) return;
  openSheet({
    title,
    fields: [{ type: 'text', name: 'desc', label: 'Descrição', value: it.desc }, { type: 'money', name: 'valor', label: 'Valor', value: it.valor },
      ...(withPag ? [{ type: 'pag', name: 'pag', value: it.pag }] : [])],
    onSave: v => { if (!need(v.desc, 'Informe a descrição')) return false; Object.assign(it, v); },
    onDelete: () => { if (!confirm('Excluir "' + it.desc + '"?')) return false; m[listName] = m[listName].filter(x => x.id !== id); },
  });
}

function editFixaMes(id) {
  const m = S.meses[ui.mes], it = m.fixas.find(x => x.id === id); if (!it) return;
  openSheet({
    title: 'Fixa de ' + label(ui.mes),
    fields: [
      { type: 'text', name: 'nome', label: 'Descrição', value: it.nome },
      { type: 'money', name: 'valor', label: 'Valor neste mês', value: it.valor, hint: 'Muda só este mês. Para mudar todos, use a aba Fixos.' },
      { type: 'pag', name: 'pag', value: it.pag },
      { type: 'check', name: 'pago', label: 'Já paguei', value: it.pago },
    ],
    onSave: v => { if (!need(v.nome, 'Informe a descrição')) return false; Object.assign(it, v); },
    onDelete: () => { if (!confirm('Remover "' + it.nome + '" só deste mês?')) return false; m.fixas = m.fixas.filter(x => x.id !== id); },
    deleteLabel: 'Remover deste mês',
  });
}

function editFixo(id) {
  const novo = !id, f = novo ? { id: uid(), nome: '', valor: 0, pag: '' } : S.fixos.find(x => x.id === id);
  if (!f) return;
  openSheet({
    title: novo ? 'Novo gasto fixo' : 'Editar gasto fixo',
    fields: [{ type: 'text', name: 'nome', label: 'Descrição', value: f.nome, ph: 'Ex.: Aluguel' }, { type: 'money', name: 'valor', label: 'Valor mensal', value: novo ? '' : f.valor }, { type: 'pag', name: 'pag', value: f.pag }],
    onSave: v => {
      if (!need(v.nome, 'Informe a descrição')) return false;
      Object.assign(f, v);
      if (novo) S.fixos.push(f);
      mesesFuturos().forEach(k => {
        const fx = S.meses[k].fixas, it = fx.find(x => x.ref === f.id);
        if (it) { if (!it.pago) Object.assign(it, { nome: f.nome, valor: f.valor, pag: f.pag }); }
        else fx.push({ id: uid(), ref: f.id, nome: f.nome, valor: f.valor, pag: f.pag, pago: false });
      });
      toast(novo ? 'Fixo cadastrado' : 'Fixo atualizado');
    },
    onDelete: novo ? null : () => {
      if (!confirm('Excluir "' + f.nome + '" dos fixos? Ele sai dos meses a partir de hoje (os já pagos ficam).')) return false;
      S.fixos = S.fixos.filter(x => x.id !== f.id);
      mesesFuturos().forEach(k => { S.meses[k].fixas = S.meses[k].fixas.filter(x => !(x.ref === f.id && !x.pago)); });
    },
  });
}


function editPag(id) {
  const novo = !id, p = novo ? { id: uid(), nome: '', tipo: 'cartao' } : pagById(id); if (!p) return;
  openSheet({
    title: novo ? 'Nova forma de pagamento' : 'Editar forma de pagamento',
    fields: [{ type: 'text', name: 'nome', label: 'Nome', value: p.nome, ph: 'Ex.: Cartão Inter' }, { type: 'select', name: 'tipo', label: 'Tipo', value: p.tipo, options: TIPOS_PAG }],
    onSave: v => { if (!need(v.nome, 'Informe o nome')) return false; Object.assign(p, v); if (novo) S.pagamentos.push(p); },
    onDelete: novo ? null : () => {
      if (!confirm('Excluir "' + p.nome + '"? Os lançamentos com ela ficarão como "Não informado".')) return false;
      S.pagamentos = S.pagamentos.filter(x => x.id !== id);
      const clear = x => { if (x.pag === id) x.pag = ''; };
      S.fixos.forEach(clear);
      Object.values(S.meses).forEach(m => { m.fixas.forEach(clear); m.variaveis.forEach(clear); });
    },
  });
}

function exportar() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `financas-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data.meses !== 'object' || !Array.isArray(data.fixos)) throw new Error();
    if (!confirm('Substituir os dados deste aparelho pelo backup?')) return;
    S = data; normalize(); save();
    ui.mes = mesInicial(); ui.tab = 'mes'; render(); toast('Backup importado');
  } catch (err) { toast('Arquivo de backup inválido'); }
});

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('#nav button');
  if (tabBtn) { ui.tab = tabBtn.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-a]'); if (!b || b.closest('.ov')) return;
  const a = b.dataset.a, id = b.dataset.id, m = S.meses[ui.mes];
  switch (a) {
    case 'prev': ui.mes = addMonth(ui.mes, -1); render(); break;
    case 'next': ui.mes = addMonth(ui.mes, 1); render(); break;
    case 'criar': S.meses[ui.mes] = novoMes(ui.mes); save(); render(); toast(label(ui.mes) + ' criado'); break;
    case 'goto': ui.mes = b.dataset.k; ui.tab = 'mes'; render(); window.scrollTo(0, 0); break;
    case 'add': if (m) addLancamento(b.dataset.tipo); break;
    case 'pago': { const f = m.fixas.find(x => x.id === id); if (f) { f.pago = !f.pago; save(); render(); } break; }
    case 'ed-fixa': editFixaMes(id); break;
    case 'ed-var': editarItem('variaveis', id, 'Gasto variável', true); break;
    case 'ed-inv': editarItem('invest', id, 'Investimento', false); break;
    case 'ed-extra': editarItem('extras', id, 'Renda extra', false); break;
    case 'ed-grupo': editGrupo(id); break;
    case 'ed-ret': retirada(null, id); break;
    case 'retirar': retirada(b.dataset.dest); break;
    case 'aporte': novoAporte(); break;
    case 'ver-movs': ui.verTodosMovs = true; render(); break;
    case 'ed-sal': editSalario(); break;
    case 'voz': if (m) abrirVoz(); break;
    case 'ed-salpadrao': openSheet({ title: 'Salário fixo padrão', fields: [{ type: 'money', name: 'salario', label: 'Valor', value: S.salarioPadrao }, { type: 'check', name: 'aplicar', label: 'Aplicar também aos meses já criados a partir de hoje', value: false }], onSave: v => { S.salarioPadrao = v.salario; if (v.aplicar) mesesFuturos().forEach(k => S.meses[k].salario = v.salario); toast('Salário atualizado'); } }); break;
    case 'ed-fixo': editFixo(id); break;
    case 'add-fixo': editFixo(null); break;
    case 'ed-pag': editPag(id); break;
    case 'add-pag': editPag(null); break;
    case 'grupo': {
      const g = b.dataset.g;
      ui.abertos.has(g) ? ui.abertos.delete(g) : ui.abertos.add(g);
      const sec = b.closest('.grp'); sec.classList.toggle('open'); b.setAttribute('aria-expanded', ui.abertos.has(g));
      break;
    }
    case 'go-config': ui.tab = 'config'; render(); window.scrollTo(0, 0); break;
    case 'cfg-sync': openSheet({
      title: 'Conectar ao GitHub', saveLabel: 'Conectar',
      fields: [
        { type: 'text', name: 'owner', label: 'Seu usuário do GitHub', value: SY.owner, ph: 'ex.: thiagosilva' },
        { type: 'text', name: 'repo', label: 'Repositório (privado) dos dados', value: SY.repo, ph: 'ex.: financas-dados' },
        { type: 'text', name: 'path', label: 'Arquivo', value: SY.path || 'dados.json' },
        { type: 'password', name: 'token', label: 'Token (fine-grained)', value: SY.token, ph: 'github_pat_…', hint: 'Fica guardado só neste aparelho.' },
        { type: 'check', name: 'auto', label: 'Salvar no GitHub automaticamente', value: SY.auto },
      ],
      onSave: v => {
        if (!need(v.owner && v.repo && v.token, 'Preencha usuário, repositório e token')) return false;
        const mudouDestino = v.owner !== SY.owner || v.repo !== SY.repo || v.path !== SY.path;
        Object.assign(SY, { owner: v.owner.replace(/^@/, ''), repo: v.repo, path: v.path || 'dados.json', token: v.token, auto: v.auto });
        if (mudouDestino) SY.sha = null;
        saveSync(); setTimeout(conectarGitHub, 250);
        return 'nosave';
      },
    }); break;
    case 'sync-now': sincronizar({ toastOk: true }).then(render); break;
    case 'sync-off': if (confirm('Desconectar do GitHub neste aparelho? Os dados continuam aqui e no GitHub.')) { Object.assign(SY, { token: '', sha: null }); saveSync(); setSync('off'); render(); } break;
    case 'export': exportar(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': if (confirm('Apagar tudo deste aparelho e voltar aos dados da planilha?' + (syncOn() ? ' Isso também substitui os dados salvos no GitHub.' : '') + ' Exporte um backup antes, se precisar.')) { S = seed(); save(); ui.mes = mesInicial(); ui.tab = 'mes'; render(); toast('Dados restaurados'); } break;
  }
});

/* ============ início ============ */
loadSync();
load();
ui.mes = mesInicial();
if (syncOn()) syncState.status = SY.dirty ? 'pend' : 'ok';
render();
if (syncOn()) sincronizar({ silent: true });
/* ao voltar para o app (ex.: depois de usar no computador), busca as novidades */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncOn()) sincronizar({ silent: true }); });
window.addEventListener('online', () => { if (syncOn()) sincronizar({ silent: true }); });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
